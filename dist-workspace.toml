[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["README.md", "LICENSE", "NOTICE"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.xz"
# Checksums to generate for each App
checksum = "sha256"
# Whether CI should trigger releases with dispatches instead of tag pushes
dispatch-releases = false
# Publish jobs to run in CI
publish-jobs = []
# Which actions to run on pull requests
pr-run-mode = "skip"

# Build the formula from the archives fetched by the global artifact job.
# This produces a reviewable artifact; it does not push to a Homebrew tap.
[[dist.extra-artifacts]]
build = ["python3", "dist/homebrew/render.py"]
artifacts = ["target/homebrew/squad.rb"]

# Build the macOS archive on the project's own Apple Silicon runner (hueb);
# hosted macos-15 capacity stalled the v0.1.1 release for 90+ minutes.
[dist.github-custom-runners]
aarch64-apple-darwin = "squad-mac-release"
