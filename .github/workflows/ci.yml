name: CI

on:
  push:
    # Self-hosted runners take one job at a time: only branches that ship get a full run.
    branches: [main, 'release-*', 'integration-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPENROUTER_API_KEY: ''
  CARGO_BUILD_JOBS: '4'
  # Each room fixture already runs multiple workers. Keep fixture fan-out
  # within the quota-limited runner without relaxing lifecycle deadlines.
  RUST_TEST_THREADS: '1'
  NEXTEST_TEST_THREADS: '1'

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner_variable: CI_MACOS_RUNNER
          - os: ubuntu-latest
            runner_variable: CI_LINUX_RUNNER
    name: rust (${{ matrix.os }})
    # Public PR code stays on hosted machines, including same-repository PRs.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars[matrix.runner_variable] || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain and development tools
        run: |
          ./setup.sh --yes --no-build
          printf '%s\n' "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Isolate application state
        run: |
          mkdir -p "$RUNNER_TEMP/squad-ci/data" "$RUNNER_TEMP/squad-ci/config"
          printf 'SQUAD_DATA_DIR=%s\nXDG_CONFIG_HOME=%s\n' "$RUNNER_TEMP/squad-ci/data" "$RUNNER_TEMP/squad-ci/config" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Nextest
        run: cargo nextest run --workspace --locked
      - name: Documentation tests
        run: cargo test --workspace --doc --locked

  shellcheck:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: shellcheck setup.sh scripts/*.sh

  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner_variable: CI_MACOS_RUNNER
          - os: ubuntu-latest
            runner_variable: CI_LINUX_RUNNER
    name: setup (${{ matrix.os }})
    # Public PR code stays on hosted machines, including same-repository PRs.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars[matrix.runner_variable] || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Test installer without host changes
        run: ./scripts/test-setup.sh
      - name: Check installer shell on both platforms
        run: |
          if ! command -v shellcheck >/dev/null; then
            if command -v brew >/dev/null; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck; fi
          fi
          shellcheck setup.sh scripts/*.sh
      - name: Run full setup with fixture credential
        env:
          OPENROUTER_API_KEY: sk-ci-dummy
        run: ./setup.sh --yes

  setup-containers:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable-slim, fedora:latest]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare non-root installer user
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y sudo git curl ca-certificates
          else
            dnf install -y sudo git curl-minimal ca-certificates shadow-utils
          fi
          useradd --create-home --shell /bin/bash installer
          printf 'installer ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/installer
          chmod 440 /etc/sudoers.d/installer
      - uses: actions/checkout@v4
      - name: Full setup with dummy credential
        shell: bash
        run: |
          chown -R installer:installer "$GITHUB_WORKSPACE"
          sudo -H -u installer env CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" OPENROUTER_API_KEY=sk-ci-dummy ./setup.sh --yes
      - name: Full setup with missing credential must fail
        shell: bash
        run: |
          set +e
          sudo -H -u installer env CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" OPENROUTER_API_KEY= ./setup.sh --yes > setup-empty-key.log 2>&1
          status=$?
          set -e
          cat setup-empty-key.log
          test "$status" -ne 0
          grep -q 'OPENROUTER_API_KEY is required' setup-empty-key.log
          grep -q 'squad doctor failed' setup-empty-key.log
