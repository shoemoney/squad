[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/shoemoney/squad"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
insta = { version = "1", features = ["json"] }
proptest = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tempfile = "3"
squad-protocol = { path = "crates/squad-protocol", version = "0.1.0" }
squad-store = { path = "crates/squad-store", version = "0.1.0" }
squad-agents = { path = "crates/squad-agents", version = "0.1.0" }
squad-core = { path = "crates/squad-core", version = "0.1.0" }
squad-tui = { path = "crates/squad-tui", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
