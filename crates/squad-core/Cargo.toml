[package]
name = "squad-core"
description = "Squad core: bus, router, contest engine, prompts, export and the room handle."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
squad-protocol = { workspace = true }
squad-store = { workspace = true }
squad-agents = { workspace = true }
figlet-rs = "1"
unicode-width = "0.2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tokio-util = "0.7"
chrono = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
tracing.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }
wiremock = "0.6"
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "test-util"] }
insta = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
