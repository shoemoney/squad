[package]
name = "squad-agents"
description = "Squad agent executors: OpenRouter client, model registry and context-bound workers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
squad-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-util = "0.7"
futures = "0.3"
async-stream = "0.3"
rand = "0.9"
httpdate = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
