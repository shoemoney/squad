[package]
name = "squad-store"
description = "Squad SQLite store: schema, migrations and the transactional commit API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
squad-protocol = { workspace = true }
serde_json.workspace = true
serde.workspace = true
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
# rusqlite 0.39 bundles SQLite 3.51.3; 3.51.1 can deadlock concurrent WAL open/close.
rusqlite = { version = "0.39", features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
