[package]
name = "squad-cli"
description = "A terminal chat room for multiple language models through OpenRouter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage = "https://github.com/shoemoney/squad"
keywords = ["cli", "tui", "chat", "llm", "openrouter"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "squad"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["string"] }
crossterm = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
squad-protocol = { workspace = true }
squad-core = { workspace = true }
squad-store = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = "0.4"
squad-tui = { workspace = true }

[dev-dependencies]
squad-agents = { workspace = true }
wiremock = "0.6"
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
