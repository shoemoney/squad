[package]
name = "squad-cli"
description = "A terminal chat room for multiple language models through OpenRouter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage = "https://github.com/shoemoney/squad"
keywords = ["cli", "tui", "chat", "llm", "openrouter"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "squad"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { workspace = true, features = ["string"] }
crossterm = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
squad-protocol = { workspace = true }
squad-core = { workspace = true }
squad-store = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "io-util", "process"] }
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = "0.4"
squad-tui = { workspace = true }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
subtle = "2"
uuid = "1"
tokio-util = "0.7"
schemars = "1"

[dev-dependencies]
squad-agents = { workspace = true }
wiremock = "0.6"
insta = { workspace = true }
tempfile = { workspace = true }
portable-pty = "=0.9.0"
vt100 = "=0.18.1"
p256 = "0.13"

[lints]
workspace = true
